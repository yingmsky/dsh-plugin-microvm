name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: unit (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  e2e-dsh:
    name: e2e in a real DeepSeek Harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install dsh
        run: |
          echo "DSH_HOME=$RUNNER_TEMP/dsh-home" >> "$GITHUB_ENV"
          npm install -g @deepseek-ai/dsh && dsh --version
      - name: Install this checkout as a plugin
        run: dsh plugin --profile microvm-e2e add "$GITHUB_WORKSPACE"
      - name: Bundle layer is composed
        run: dsh --profile microvm-e2e --dump-config | tee config.txt | grep -n "dsh-plugin-microvm"
      - name: Record installed tool-call shape (debug)
        if: always()
        run: |
          F=$(find "$(npm root -g)/@deepseek-ai" -path '*dsh-tools/lib/*.js' 2>/dev/null | head -50)
          V=$(node -p "require('$(npm root -g)/@deepseek-ai/dsh/package.json').version")
          HITS=$(grep -ho "parseArguments([^)]*)\|arguments: [a-zA-Z_.]*\(block\|call\)[a-zA-Z_.]*" $F 2>/dev/null | sort | uniq -c | head -10 | tr '\n' ';')
          echo "::notice title=dsh $V tool-call shape::$HITS"
      - name: Boot DSH and drive the tools through its pipeline
        run: node test/e2e/run.mjs microvm-e2e

  install-from-github:
    name: install via github spec
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: e2e-dsh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install dsh
        run: |
          echo "DSH_HOME=$RUNNER_TEMP/dsh-home" >> "$GITHUB_ENV"
          npm install -g @deepseek-ai/dsh
      - name: dsh plugin add github:${{ github.repository }}#${{ github.sha }}
        run: dsh plugin --profile gh add "github:${{ github.repository }}#${{ github.sha }}"
      - run: dsh --profile gh --dump-config | grep -n "dsh-plugin-microvm"
